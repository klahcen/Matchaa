services:
  db:
    image: postgres:18
    container_name: matcha-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: matcha_db
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matcha_db -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - matcha-network

  adminer:
    image: adminer
    container_name: matcha-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-8080}:8080"
    depends_on:
      - db
    networks:
      - matcha-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: matcha-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # The Vite dev proxy runs inside this container, so it must reach the
      # backend by its service name rather than localhost.
      - VITE_PROXY_TARGET=http://backend:3000
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    networks:
      - matcha-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: matcha-backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: ./Backend/.env
        required: false
    environment:
      DB_HOST: matcha-pg
      DB_PORT: 5432
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Backend:/app
      - /app/node_modules
    networks:
      - matcha-network
volumes:
  pgdata:

networks:
  matcha-network:
    driver: bridge
